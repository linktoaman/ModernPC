name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deployment stage to exercise after verification"
        required: false
        default: "staging"
        type: choice
        options:
          - staging
          - production
      rollback_ref:
        description: "Optional release, image, or artifact reference for rollback drills"
        required: false
        type: string

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  STAFF_AUTH_PROVIDER: development-header
  STAFF_AUTH_TRUSTED_HEADERS_ENABLED: "false"
  NPM_AUDIT_LEVEL: critical

jobs:
  verify:
    name: Install, Test, Build, and Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Security audit
        run: npm run security:audit

      - name: Secret scan
        run: npm run secrets:scan

      - name: Accessibility smoke check
        run: npm run accessibility

      - name: Generate SBOM
        run: npm run sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: artifacts/sbom.cdx.json
          if-no-files-found: error

  staged-deployment:
    name: Staged Deployment Hook
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    environment:
      name: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deployment target
        run: |
          echo "Deployment target: ${DEPLOY_TARGET:-staging}"
          echo "Provider-specific deployment commands plug in here."
          echo "This hook intentionally runs without cloud or IdP credentials by default."
        env:
          DEPLOY_TARGET: ${{ inputs.deploy_target || 'staging' }}

  rollback-hook:
    name: Rollback Hook
    runs-on: ubuntu-latest
    needs: staged-deployment
    if: always() && needs.staged-deployment.result == 'failure'

    steps:
      - name: Prepare rollback
        run: |
          echo "Rollback requested for failed staged deployment."
          echo "Rollback reference: ${ROLLBACK_REF:-last-known-good}"
          echo "Provider-specific rollback commands plug in here."
        env:
          ROLLBACK_REF: ${{ inputs.rollback_ref || 'last-known-good' }}
